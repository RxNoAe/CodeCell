name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch opencode runtime
        env:
          OPENCODE_VERSION: "1.19.4"
          OPENCODE_DEB_SHA256: "7ad3b52f3568d668d7187bcafc5eb2039375de0698b6e533c48424897e42af02"
        run: |
          set -euo pipefail
          DEB="opencode_${OPENCODE_VERSION}_aarch64.deb"
          URL="https://github.com/bd-loser/opencode-bionic/releases/download/v${OPENCODE_VERSION}/${DEB}"
          curl -fsSL "$URL" -o "$DEB"
          echo "${OPENCODE_DEB_SHA256}  ${DEB}" | sha256sum -c -
          ar x "$DEB"
          TARBALL=$(ls data.tar.*)
          tar -xf "$TARBALL" ./data/data/com.termux/files/usr/bin/opencode
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp ./data/data/com.termux/files/usr/bin/opencode app/src/main/jniLibs/arm64-v8a/libopencode.so
          rm -rf data.tar.* data ./data "$DEB"
          ls -lh app/src/main/jniLibs/arm64-v8a/libopencode.so

      - name: Fetch proot runtime
        run: |
          set -euo pipefail
          BASE="https://packages.termux.dev/apt/termux-main/pool/main"
          fetch() {
            curl -fsSL "$1" -o "$2"
            echo "$3  $2" | sha256sum -c -
          }
          fetch "$BASE/p/proot/proot_5.1.107.101_aarch64.deb" proot.deb \
            "a28355e9be257e1f87f4e9294b3118470d4fd7a5442fed8b278f4443c83407d7"
          fetch "$BASE/libt/libtalloc/libtalloc_2.5.0_aarch64.deb" libtalloc.deb \
            "556591f43bb773ad8777e1a29522640866a55f95dab71914418b94a8c58ad5a7"
          fetch "$BASE/liba/libandroid-shmem/libandroid-shmem_0.7_aarch64.deb" libandroid-shmem.deb \
            "0da3a24d558b93c92bcf8d611e0826a99ff96e396b148e6cdf33b47c47c57ff6"
          for pkg in proot libtalloc libandroid-shmem; do
            mkdir -p "$pkg"
            (cd "$pkg" && ar x "../$pkg.deb" && tar -xf data.tar.*)
          done
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp proot/data/data/com.termux/files/usr/bin/proot \
            app/src/main/jniLibs/arm64-v8a/libproot.so
          cp proot/data/data/com.termux/files/usr/libexec/proot/loader \
            app/src/main/jniLibs/arm64-v8a/libprootloader.so
          cp libtalloc/data/data/com.termux/files/usr/lib/libtalloc.so.2.5.0 \
            app/src/main/jniLibs/arm64-v8a/libtalloc.so
          cp libandroid-shmem/data/data/com.termux/files/usr/lib/libandroid-shmem.so \
            app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libproot.so \
            app/src/main/jniLibs/arm64-v8a/libprootloader.so
          rm -rf proot libtalloc libandroid-shmem data.tar.* proot.deb libtalloc.deb libandroid-shmem.deb
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Build shell launcher
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          test -x "$CC"
          "$CC" -O2 -fPIE -pie -o app/src/main/jniLibs/arm64-v8a/libcodecell-shell.so tools/shell_launcher.c
          chmod 755 app/src/main/jniLibs/arm64-v8a/libcodecell-shell.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libcodecell-shell.so

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk "CodeCell-1.0.${{ github.run_number }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeCell-debug
          path: CodeCell-1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            "CodeCell-1.0.${{ github.run_number }}.apk" \
            --title "CodeCell v1.0.${{ github.run_number }}" \
            --notes "Automated build of \`${{ github.sha }}\` from \`main\`." \
            --latest
